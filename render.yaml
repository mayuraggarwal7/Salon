# One-click deploy of the salon app on Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: salon
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn salon_project.wsgi:application --workers 2 --timeout 60
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: salon-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ADMIN_USERNAME
        value: admin
      - key: DJANGO_ADMIN_PASSWORD
        sync: false # you type this in when creating the Blueprint
      - key: SALON_SEED_DEMO
        value: "true" # sample services, stylists and hours; set to false for a clean start
      - key: SALON_NAME
        value: Glow Salon
      - key: SALON_TIME_ZONE
        value: Asia/Kolkata
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_PUBLIC_NUMBER
        sync: false

databases:
  - name: salon-db
    plan: free
    databaseName: salon
    user: salon
