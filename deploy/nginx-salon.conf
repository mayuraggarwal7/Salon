# Nginx site for the salon app when Nginx already owns ports 80/443.
# Copy to /etc/nginx/sites-available/salon, replace SALON_DOMAIN, enable it, then run
# certbot --nginx -d SALON_DOMAIN to add HTTPS. See DEPLOY-OVH.md.
server {
    listen 80;
    listen [::]:80;
    server_name SALON_DOMAIN;

    client_max_body_size 20m;   # invoice scans and CSV imports

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
